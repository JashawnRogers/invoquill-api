services:
  dev-postgres-db:
    image: postgres:18
    container_name: invoquill-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoquill-dev
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_USER: jashawnrogers
      SPRING_DATASOURCE_URL: jdbc:postgresql://dev-postgres-db:5432/invoquill-dev
    ports:
      - "5432:5432"
    volumes:
      - invoquill-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jashawnrogers -d invoquill-dev"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin-ui:
    image: dpage/pgadmin4
    container_name: pgadmin-invoquill-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      dev-postgres-db:
        condition: service_healthy
volumes:
  invoquill-dev-db: